<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails Commande - Plans de Prévention</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
  <nav class="bg-blue-600 text-white shadow">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold">Plans de Prévention</h1>
        <a href="index.html" class="bg-blue-700 px-4 py-2 rounded hover:bg-blue-800">← Retour Accueil</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-8">
    <div id="errorMsg" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6 hidden"></div>

    <!-- Command Details Form -->
    <div class="bg-white rounded-lg shadow p-8">
      <h2 id="pageTitle" class="text-2xl font-bold mb-6">Détails de la Commande</h2>

      <form id="commandForm">
        <!-- Commande Info -->
        <fieldset class="border border-gray-300 rounded p-4 mb-6">
          <legend class="text-lg font-semibold px-2">📋 Information Commande</legend>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
              <label class="block text-sm font-medium mb-2">N° Commande</label>
              <input id="orderNumber" type="text" readonly class="w-full px-4 py-2 border border-gray-300 rounded bg-gray-100">
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Chargé d'opération</label>
              <input id="operator" type="text" readonly class="w-full px-4 py-2 border border-gray-300 rounded bg-gray-100">
            </div>
          </div>
        </fieldset>

        <!-- Company Info -->
        <fieldset class="border border-gray-300 rounded p-4 mb-6">
          <legend class="text-lg font-semibold px-2">🏢 Entreprise & Adresse</legend>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div class="md:col-span-2">
              <label class="block text-sm font-medium mb-2">Entreprise</label>
              <input id="company" type="text" readonly class="w-full px-4 py-2 border border-gray-300 rounded bg-gray-100">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium mb-2">Adresse</label>
              <input id="address" type="text" class="w-full px-4 py-2 border border-gray-300 rounded" placeholder="Adresse modifiable">
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Montant TTC</label>
              <input id="amount" type="text" readonly class="w-full px-4 py-2 border border-gray-300 rounded bg-gray-100">
            </div>
          </div>
        </fieldset>

        <!-- Work Details -->
        <fieldset class="border border-gray-300 rounded p-4 mb-6">
          <legend class="text-lg font-semibold px-2">🔨 Description des Travaux</legend>

          <div class="mt-4">
            <label class="block text-sm font-medium mb-2">Nature des Travaux</label>
            <input id="workNature" type="text" readonly class="w-full px-4 py-2 border border-gray-300 rounded bg-gray-100 mb-4">

            <label class="block text-sm font-medium mb-2">Description Détaillée</label>
            <textarea id="workDescription" class="w-full px-4 py-2 border border-gray-300 rounded" rows="4" placeholder="Description modifiable si nécessaire"></textarea>
          </div>
        </fieldset>

        <!-- Trades/Corps d'états -->
        <fieldset class="border border-gray-300 rounded p-4 mb-6">
          <legend class="text-lg font-semibold px-2">🔧 Corps d'États (Métiers)</legend>

          <div id="tradesContainer" class="mt-4 space-y-2">
            <!-- Dynamically populated -->
          </div>
        </fieldset>

        <!-- Security Measures -->
        <fieldset class="border border-gray-300 rounded p-4 mb-6">
          <legend class="text-lg font-semibold px-2">⚠️ Mesures de Sécurité</legend>

          <p class="text-sm text-gray-600 mb-4">Sélectionnez les mesures applicables à cette commande</p>

          <div id="measuresContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
            <!-- Dynamically populated -->
          </div>
        </fieldset>

        <!-- Action Buttons -->
        <div class="flex gap-4 justify-between">
          <button type="button" id="backBtn" class="px-6 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">
            ← Retour
          </button>
          <button type="button" id="previewBtn" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
            👁️ Voir Aperçu PDF
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
